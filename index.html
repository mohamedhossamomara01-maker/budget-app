<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>ميزانيتي</title>

  <!-- PWA manifest — عشان تطبيق الأندرويد (Bubblewrap) يقدر يتعرف على التطبيق -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#070c16">
  <meta name="background-color" content="#070c16">

  <!-- أيقونات للمتصفح ولإضافة الصفحة على الشاشة الرئيسية -->
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-512.png">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #070c16;
      overscroll-behavior: none;
    }
    #root {
      min-height: 100vh;
    }
  </style>

  <!-- React + ReactDOM -->
  <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Supabase JS (لمزامنة البيانات على السحابة) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div id="root"></div>

  <!-- كود التطبيق نفسه -->
  <script src="app.js"></script>
</body>
</html>
